name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks config is active (custom and default rules must fire on a probe)
        run: |
          probe="$RUNNER_TEMP/gitleaks-probe"
          mkdir -p "$probe/docs/specs"
          # Random values generated at run time: this file contains no hostname or key, and a
          # rule narrowed to one fixed probe value, or a docs/ path allowlist, would not pass.
          printf -v host 'p%s.tail%s.%s' "$(openssl rand -hex 4)" "$(openssl rand -hex 3)" ts.net
          key="AKIA$(LC_ALL=C tr -dc 'A-Z2-7' < /dev/urandom | head -c 16)"
          printf 'http://%s:8123\naws_access_key_id = %s\n' "$host" "$key" > "$probe/docs/specs/probe.md"
          # Leaks exit with 3, so a gitleaks error (1) or a docker failure (125+) is told apart.
          rc=0
          docker run --rm -v "$PWD:/repo:ro" -v "$probe:/probe" "$GITLEAKS_IMAGE" \
            dir --config /repo/.gitleaks.toml --exit-code 3 --redact --no-banner \
            --report-format json --report-path /probe/report.json /probe/docs || rc=$?
          case "$rc" in
            3) ;;
            0) echo "::error::gitleaks found nothing in the probe: .gitleaks.toml rules are not active"; exit 1 ;;
            1) echo "::error::gitleaks failed on the probe (config or runtime error, see the log)"; exit 1 ;;
            *) echo "::error::docker could not run gitleaks (exit $rc)"; exit 1 ;;
          esac
          # The custom rule and a default rule (useDefault = true) must both be active.
          for rule in tailnet-hostname aws-access-token; do
            jq -e --arg r "$rule" 'any(.[]; .RuleID == $r)' "$probe/report.json" > /dev/null \
              || { echo "::error::gitleaks rule $rule did not fire on the probe"; exit 1; }
          done
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --config /repo/.gitleaks.toml --redact --no-banner /repo
      - name: gitleaks (final tree, covers merge resolutions)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir --config /repo/.gitleaks.toml --redact --no-banner /repo
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: install pydantic (hash-pinned)
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
      - name: embedded Python contracts parse and build
        run: python3 scripts/check_contracts.py
      - name: contract checker tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
  whitespace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Diffing the whole tree against the empty tree treats every tracked file as added,
      # so --check flags trailing whitespace anywhere, not only in this change.
      - name: no trailing whitespace in any tracked file
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
