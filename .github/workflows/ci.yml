name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks config is active (the tailnet-hostname rule must fire on a probe)
        run: |
          probe="$RUNNER_TEMP/gitleaks-probe"
          mkdir -p "$probe"
          # Built at run time so this workflow file does not itself contain a tailnet hostname.
          printf 'http://probe.tail0a1b2c.%s:8123\n' ts.net > "$probe/probe.md"
          # Leaks exit with 3, so an error (exit 1) is not mistaken for a detection.
          rc=0
          docker run --rm -v "$PWD:/repo:ro" -v "$probe:/probe:ro" "$GITLEAKS_IMAGE" \
            dir --config /repo/.gitleaks.toml --exit-code 3 --redact --no-banner /probe || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "::error::the tailnet-hostname rule from .gitleaks.toml did not fire (exit $rc)"
            exit 1
          fi
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --config /repo/.gitleaks.toml --redact --no-banner /repo
      - name: gitleaks (final tree, covers merge resolutions)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir --config /repo/.gitleaks.toml --redact --no-banner /repo
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: install pydantic (hash-pinned)
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
      - name: embedded Python contracts parse and build
        run: python3 scripts/check_contracts.py
      - name: contract checker tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
  whitespace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Diffing the whole tree against the empty tree treats every tracked file as added,
      # so --check flags trailing whitespace anywhere, not only in this change.
      - name: no trailing whitespace in any tracked file
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
