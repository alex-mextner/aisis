name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main keeps its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks config is active (custom and default rules must fire on a probe)
        run: bash scripts/gitleaks-probe.sh "$GITLEAKS_IMAGE"
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git --config /repo/.gitleaks.toml --redact --no-banner /repo
      - name: gitleaks (final tree, covers merge resolutions)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" dir --config /repo/.gitleaks.toml --redact --no-banner /repo
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: install pydantic (hash-pinned)
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
      - name: embedded Python contracts parse and build
        run: python3 scripts/check_contracts.py
      - name: contract checker tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
  whitespace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Diffing the whole tree against the empty tree treats every tracked file as added,
      # so --check flags trailing whitespace anywhere, not only in this change.
      - name: no trailing whitespace in any tracked file
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
