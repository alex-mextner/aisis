# Example of the private fixed-lease list (AISIS_LAN_DHCP_HOSTS_FILE). One line per device: dhcp-host=<mac>,<ip>[,<name>]
# Keep the real file under ~/.config/aisis; a line for the speaker's MAC is ignored (the generator pins it itself).
dhcp-host=02:00:00:00:00:10,192.0.2.10,front-host
dhcp-host=02:00:00:00:00:20,192.0.2.20,backend-host
