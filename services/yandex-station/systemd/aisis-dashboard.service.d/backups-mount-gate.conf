# backups-mount-gate (rig-cli ticket 858), managed by backups-user-gates: remove with `backups-user-gates revert`.
# Why: this unit uses a tree that is a bind mount of the backups USB disk. Without the disk that path is an empty
# directory on the SSD, and starting here would silently work in (and write to) the wrong place. The condition makes
# systemd skip the start; backups-mount-retry.timer starts the unit once the mounts are back.
[Unit]
ConditionPathIsMountPoint=%h/xp
