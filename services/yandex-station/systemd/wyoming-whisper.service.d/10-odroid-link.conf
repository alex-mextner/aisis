# STT for HA on the ODROID (odroidn2), reached over Tailscale by name:
# tcp://this host's tailnet name:10300 (RTX 4060 here; the ODROID has no NVIDIA GPU).
# Bind fails until tailscaled has the address; Restart keeps retrying.
[Unit]
StartLimitIntervalSec=0
After=tailscaled.service
[Service]
Restart=always
RestartSec=5
