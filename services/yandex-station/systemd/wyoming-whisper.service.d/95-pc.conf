# ubuntu-pc: venv rebuilt on system python (no Linuxbrew). Listener binds the tailnet interface
# address (resolved at start); HA addresses it as this host's tailnet name:10300. Never 0.0.0.0/LAN.
# No system CUDA 12 libs here (no root): cuBLAS/cuDNN 12 come from the venv's nvidia-* wheels; av is pinned to 17.0.1
# (faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in av 19).
[Service]
Environment=LD_LIBRARY_PATH=%h/wyoming-env/lib/python3.14/site-packages/nvidia/cublas/lib:%h/wyoming-env/lib/python3.14/site-packages/nvidia/cudnn/lib:%h/wyoming-env/lib/python3.14/site-packages/nvidia/cuda_nvrtc/lib
EnvironmentFile=-%h/.config/aisis/whisper-prompt.env
ExecStart=
ExecStart=%h/.local/bin/tailnet-bind-exec WYOMING_BIND %h/wyoming-env/bin/python3 -m wyoming_faster_whisper --uri tcp://@IP@:10300 --data-dir %h/wyoming-data --download-dir %h/wyoming-data --model large-v3-turbo --language auto --device cuda --initial-prompt "${WHISPER_INITIAL_PROMPT}"
