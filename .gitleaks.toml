# gitleaks configuration: the default rules plus private-endpoint rules, so the secret scan
# also enforces spec 000 section 19 (no local endpoints committed to this public repository).
[extend]
useDefault = true

[[rules]]
id = "tailnet-hostname"
description = "Tailscale MagicDNS name of a private tailnet (host, bare tailnet domain or wildcard)"
regex = '''(?i)\b[a-z0-9-]+\.ts\.net\b'''
keywords = ["ts.net"]
